plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'dev.airun'
version = '1.0.0'
base.archivesName = 'storage_fill-1.21.1-neoforge'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = '21.1.262'
    mods {
        storage_fill {
            sourceSet sourceSets.main
            if (project.hasProperty('gameTests') || project.hasProperty('integrationClient') || project.hasProperty('smokeClient')) {
                sourceSet sourceSets.test
            }
        }
    }
    unitTest {
        enable()
        testedMod = mods.storage_fill
        loadedMods = [mods.storage_fill]
    }
    runs {
        client {
            client()
            gameDirectory = file(project.findProperty('clientDir') ?: 'run/client')
            if (project.hasProperty('smokeClient') || project.hasProperty('integrationClient')) {
                systemProperty 'storage_fill.smoke', 'true'
            }
            if (project.hasProperty('integrationClient')) {
                systemProperty 'storage_fill.integration', 'true'
                programArguments.addAll '--quickPlaySingleplayer', (project.findProperty('clientWorld') ?: 'custom-fill-smoke').toString()
            }
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file(project.findProperty('gameTestDir') ?: 'run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'storage_fill'
            loadedMods = [mods.storage_fill]
        }
    }
}

dependencies {
    compileOnly 'org.apiguardian:apiguardian-api:1.1.2'
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])
    runtimeOnly files('libs/jei-1.21.1-neoforge-19.64.0.455.jar')
    testCompileOnly fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (project.hasProperty('withFtb')) {
        runtimeOnly fileTree(dir: 'libs', include: ['ftb-*.jar', 'architectury-*.jar'])
    }
    if (project.hasProperty('withStorage') || project.findProperty('storageMod') == 'rs') {
        runtimeOnly fileTree(dir: 'libs', include: ['refinedstorage-neoforge-*.jar'])
    }
    if (project.hasProperty('withStorage') || project.findProperty('storageMod') == 'bd') {
        runtimeOnly fileTree(dir: 'libs', include: ['beyonddimensions-*.jar'])
    }
    if (project.hasProperty('withStorage') || project.findProperty('storageMod') == 'ae2') {
        runtimeOnly fileTree(dir: 'libs', include: ['appliedenergistics2-*.jar', 'guideme-*.jar'])
    }
    if (project.hasProperty('withStorage') || project.findProperty('storageMod') == 'sb') {
        runtimeOnly fileTree(dir: 'libs', include: ['sophisticated*.jar'])
    }
    if (project.hasProperty('withCurios')) {
        runtimeOnly fileTree(dir: 'libs', include: ['curios-*.jar', 'refinedstorage-curios-integration-*.jar'])
    }
    if (project.hasProperty('withLegendary')) {
        runtimeOnly fileTree(dir: 'libs', include: ['legendaryinventory-*.jar'])
    }
    if (project.hasProperty('withRsAddons')) {
        runtimeOnly fileTree(dir: 'libs', include: ['refinedstorage-quartz-arsenal-*.jar'])
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test', Test).configure {
    useJUnitPlatform()
    include '**/*Test.class'
    exclude '**/*ClientTest.class', '**/ClientSmokeTest.class'
}

tasks.register('prepareGameTestStructures', Copy) {
    from 'src/test/structures'
    into("${project.findProperty('gameTestDir') ?: 'run/gametest'}/gameteststructures")
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'prepareGameTestStructures'
}
