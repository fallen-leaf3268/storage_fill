plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.38'
}
group = 'dev.airun'
version = '1.0.0'
base.archivesName = 'storage_fill-1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { storage_fill { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('smokeClient') || project.hasProperty('integrationClient')) {
                property 'storage_fill.smoke', 'true'
                mods { storage_fill { source sourceSets.test } }
            }
            if (project.hasProperty('integrationClient')) {
                property 'storage_fill.integration', 'true'
                args '--quickPlaySingleplayer', 'custom-fill-smoke'
            }
        }
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file(project.findProperty('gameTestDir') ?: (project.hasProperty('storageMod') ? "run-${project.property('storageMod')}" : 'run'))
            property 'forge.enabledGameTestNamespaces', 'storage_fill'
            mods { storage_fill { source sourceSets.test } }
        }
    }
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    flatDir { dirs 'libs' }
}
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf('local:jei-1.20.1-forge:15.59.0.212')
    compileOnly fg.deobf('local:refinedstorage:1.12.4')
    compileOnly fg.deobf('local:beyonddimensions:0.7.20')
    testCompileOnly fg.deobf('local:refinedstorage:1.12.4')
    testCompileOnly fg.deobf('local:beyonddimensions:0.7.20')
    compileOnly fg.deobf('local:appliedenergistics2-forge:15.4.10')
    compileOnly fg.deobf('local:guideme:20.1.15')
    compileOnly fg.deobf('local:sophisticatedbackpacks:1.20.1-3.26.3.2157')
    compileOnly fg.deobf('local:sophisticatedcore:1.20.1-1.5.1.2335')
    testCompileOnly fg.deobf('local:appliedenergistics2-forge:15.4.10')
    testCompileOnly fg.deobf('local:guideme:20.1.15')
    testCompileOnly fg.deobf('local:sophisticatedbackpacks:1.20.1-3.26.3.2157')
    testCompileOnly fg.deobf('local:sophisticatedcore:1.20.1-1.5.1.2335')
    ['ftb-quests-forge:2001.4.22', 'ftb-library-forge:2001.2.9',
     'ftb-teams-forge:2001.3.0', 'architectury:9.2.14:forge'].each { artifact ->
        compileOnly fg.deobf("local:${artifact}")
        testCompileOnly fg.deobf("local:${artifact}")
        if (project.hasProperty('withFtb')) runtimeOnly fg.deobf("local:${artifact}")
    }
    if (project.hasProperty('withStorage') || project.findProperty('storageMod') == 'rs') {
        runtimeOnly fg.deobf('local:refinedstorage:1.12.4')
    }
    if (project.hasProperty('withStorage') || project.findProperty('storageMod') == 'bd') {
        runtimeOnly fg.deobf('local:beyonddimensions:0.7.20')
    }
    if (project.hasProperty('withStorage') || project.findProperty('storageMod') == 'ae2') {
        runtimeOnly fg.deobf('local:appliedenergistics2-forge:15.4.10')
        runtimeOnly fg.deobf('local:guideme:20.1.15')
    }
    if (project.hasProperty('withStorage') || project.findProperty('storageMod') == 'sb') {
        runtimeOnly fg.deobf('local:sophisticatedbackpacks:1.20.1-3.26.3.2157')
        runtimeOnly fg.deobf('local:sophisticatedcore:1.20.1-1.5.1.2335')
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
mixin {
    add sourceSets.main, 'storage_fill.refmap.json'
    config 'storage_fill.mixins.json'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    dependsOn compileJava
    from(layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')) {
        rename { 'storage_fill.refmap.json' }
    }
}
test {
    useJUnitPlatform()
    exclude '**/*GameTests*.class'
}
tasks.register('prepareGameTestStructures', Copy) {
    from 'src/test/structures'
    into("${project.findProperty('gameTestDir') ?: (project.hasProperty('storageMod') ? "run-${project.property('storageMod')}" : 'run')}/gameteststructures")
}
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn 'prepareGameTestStructures'
}
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest.attributes('MixinConfigs': 'storage_fill.mixins.json')
    finalizedBy 'reobfJar'
}
